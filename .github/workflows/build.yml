name: Build Kernel Linux ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (on runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            cpio xz-utils curl busybox-static grub-pc-bin grub-common xorriso mtools kbd console-data
      - name: Compile pristine upstream kernel and create ISO
        run: |
          chmod +x build.sh
          JOBS=2 ./build.sh
      - name: Check ISO
        run: |
          test -s kernel-linux.iso
          file kernel-linux.iso
          ls -lh kernel-linux.iso
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: kernel-linux-iso
          path: kernel-linux.iso
          if-no-files-found: error
